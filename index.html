const LV=[
{c:'Itabaiana',n:'Itabaiana',y:'1939–1945',col:['#3b1d6e','#e07a3a'],t:'Severino Dias de Oliveira nasceu em Itabaiana, Paraíba, em 26 de maio de 1930. Em 13 de junho de 1939, aos nove anos, seu pai levou para casa uma sanfona de dois baixos que havia comprado para o irmão. O menino começou a experimentar o instrumento — e não parou mais.',tip:'Explore o primeiro tema: controle o fole e acompanhe as notas iluminadas.',g:'Primeiro tema: fole + melodia',ty:'seq',s:['k0','k1','k2','k4','k2','k1','k0'],o:'A infância em Itabaiana foi o primeiro capítulo de uma trajetória que atravessaria fronteiras.',a:'Primeiro acorde',
scenes:[
['Uma sanfona chega','Itabaiana, 13 de junho de 1939. A casa não é conhecida por ser um centro musical. Naquele dia, porém, uma sanfona entra na história da família.','Narrador','A sanfona não chega como um troféu. É apenas um instrumento — mas, nas mãos do menino Severino, abre uma possibilidade inesperada.'],
['O som encontra seu caminho','Sem músicos na família, Severino aprende a tocar de maneira autodidata. A prática transforma a curiosidade inicial em domínio do instrumento.','Voz dramatizada — familiar','“Tente mais uma vez. Cada tentativa encontra um som diferente.”'],
['As primeiras apresentações','Ainda criança e adolescente, Sivuca toca em festas, casamentos e encontros populares pelo interior. A música passa a fazer parte de sua vida cotidiana.','Narrador','O menino que aprendeu a explorar a sanfona começa a descobrir o que significa tocar para os outros.']
]},
{c:'Recife',n:'Recife',y:'1945–1950',col:['#14405a','#2a9d8f'],t:'Aos 15 anos, Sivuca segue para Recife e participa do programa de calouros Divertimentos Guararapes, na Rádio Clube de Pernambuco. O maestro Nelson Ferreira o apresenta ao público com o nome artístico Sivuca. Em 1948, estuda harmonia e arranjo com Guerra-Peixe e trabalha na Rádio Jornal do Commercio. Em 1950, grava em parceria com Humberto Teixeira.',tip:'Alterne os baixos com a melodia para construir uma levada.',g:'Baixo + melodia: siga o brilho',ty:'seq',s:['b0','k4','k3','k4','b1','k3','k2','k3','b0'],o:'Recife transforma o talento em profissão e prepara Sivuca para novos palcos.',a:'Baião no baixo',
scenes:[
['Uma cidade maior','Aos 15 anos, Severino deixa Itabaiana e segue para Recife. Em 1945, participa do programa de calouros Divertimentos Guararapes, na Rádio Clube de Pernambuco.','Narrador','Na Rádio Clube de Pernambuco, ele começa a construir sua trajetória profissional.'],
['Um nome para os palcos','O maestro Nelson Ferreira considera o nome Severino Dias de Oliveira comprido para os palcos e sugere Sivuca. O apelido acompanha o músico pelo resto da carreira.','Voz dramatizada — colega de rádio','“O rádio abre uma porta. O estudo ajuda a atravessá-la.”'],
['Aprender e gravar','Em 1948, Sivuca estuda harmonia e orquestração com Guerra-Peixe e passa a trabalhar na Rádio Jornal do Commercio. Em 1950, grava com Humberto Teixeira repertório ligado ao baião; “Adeus, Maria Fulô” se tornaria uma de suas gravações marcantes.','Narrador','A sanfona agora viaja também pelas ondas do rádio e pelos discos.']
]},
{c:'Rio de Janeiro',n:'Rio',y:'1955–1958',col:['#7a1f3d','#f2a65a'],t:'Em abril de 1955, Sivuca muda-se para o Rio de Janeiro e trabalha como artista contratado da Rádio e TV Tupi. A cidade amplia seu contato com a cena musical brasileira.',tip:'Toque a corrida de notas no tempo indicado.',g:'Corrida de notas: complete a sequência',ty:'run',lim:9,s:['k0','k1','k2','k3','k4','k5','k6','k7','k6','k5'],o:'A experiência no rádio e na televisão amplia o alcance de sua música e abre caminho para apresentações internacionais.',a:'Dedos velozes',
scenes:[
['Chegada ao Rio','Abril de 1955. Sivuca chega ao Rio de Janeiro, um dos grandes centros de produção cultural do país. A mudança marca uma nova etapa de sua carreira.','Narrador','A cidade oferece estúdios, emissoras e encontros com músicos de diferentes trajetórias.'],
['Rádio e televisão','Durante cerca de três anos, Sivuca trabalha como artista contratado da Rádio e TV Tupi. O público passa a conhecer melhor seu trabalho.','Voz dramatizada — produtor','“O programa está prestes a começar. Prepare a sanfona.”'],
['Novas possibilidades','A rotina de apresentações exige versatilidade. O instrumento que nasceu ligado às festas populares também encontra espaço em novos formatos e públicos.','Narrador','O próximo passo será levar essa sonoridade para além do Brasil.']
]},
{c:'Europa',n:'Europa',y:'1958–1964',col:['#1c1a40','#8e5ea2'],t:'Em 1958, Sivuca integra o grupo Os Brasileiros em uma turnê pela Europa. Depois vive em Lisboa e, a partir de 1959, trabalha em Paris por cerca de quatro anos. A experiência amplia seus encontros musicais e culturais.',tip:'Sustente a nota e controle o fole com calma.',g:'Sustente a nota na faixa de pressão',ty:'swell',k:'k2',lo:.3,hi:.7,need:4,o:'A experiência europeia prepara uma nova mudança: Nova York.',a:'Fole controlado',
scenes:[
['Do outro lado do Atlântico','Em 1958, depois de apresentações na Europa, Sivuca decide viver em Lisboa. A viagem representa uma mudança importante: sua música passa a circular em outro contexto cultural.','Narrador','A distância não apaga suas referências. Ela cria novas possibilidades de escuta.'],
['Paris','No ano seguinte, Sivuca segue para Paris e permanece na cidade por quatro anos. A capital francesa reúne artistas, estilos e públicos variados.','Voz dramatizada — músico','“Escute primeiro. Depois descubra como sua própria música conversa com o que encontrou.”'],

]},
{c:'Nova York',n:'N. York',y:'1964–1975',col:['#0b1d3a','#e76f51'],t:'Em 1964, Sivuca muda-se para Nova York. Atua como diretor musical em gravações da cantora sul-africana Miriam Makeba, excursiona por diferentes países e amplia sua atuação como arranjador e compositor, inclusive em projetos para cinema.',tip:'Alterne uma tecla branca de melodia e um botão vermelho de baixo. Cada alternância completa parte da barra.',g:'Improviso: alterne melodia e baixos até completar 100%',ty:'jam',o:'Depois de anos de trabalho internacional, Sivuca retorna ao Brasil em 1975.',a:'Improvisador',

['Miriam Makeba','Sivuca trabalha com a cantora Miriam Makeba, participando de gravações e atividades musicais. A colaboração o conecta a uma carreira internacional intensa.','Voz dramatizada — músico da equipe','“A música precisa conversar com quem está ouvindo, mesmo quando todos vêm de lugares diferentes.”'],
['Música sem fronteiras','Ao longo desses anos, Sivuca excursiona pelo mundo, grava em países como Suécia e Japão e participa de projetos variados, levando a sanfona a contextos musicais diferentes.','Narrador','Em 1975, ele retorna ao Brasil com uma bagagem artística construída em muitos lugares.']
]},
{c:'Brasil',n:'Brasil',y:'1975–2003',col:['#174b3c','#e0a84f'],t:'De volta ao Brasil em meados da década de 1970, Sivuca inicia uma fase intensa de criação e parcerias. Com a compositora Glória Gadelha, constrói uma colaboração marcante que inclui “Feira de Mangaio”. Também compõe “João e Maria” com Chico Buarque.',tip:'Alterne uma tecla branca de melodia e um botão vermelho de baixo. Cada alternância completa parte da barra.',g:'Improviso: alterne melodia e baixos até completar 100%',ty:'jam',o:'A carreira continua em movimento, unindo repertório popular, arranjos e novas experiências.',a:'Música de encontro',
scenes:[
['O retorno','Em 1975, depois de cerca de doze anos nos Estados Unidos, Sivuca retorna ao Brasil. Ele volta com experiência internacional e vontade de continuar divulgando a música brasileira.','Narrador','O retorno não é um ponto final. É o começo de uma nova fase de criação e colaboração.'],
['Glória Gadelha','Sivuca desenvolve uma parceria artística importante com a compositora Glória Gadelha. Juntos, criam músicas que se tornam parte do repertório brasileiro.','Voz dramatizada — parceira musical','“Uma ideia pode começar pequena e crescer quando duas pessoas criam juntas.”'],
['Feira de Mangaio','“Feira de Mangaio”, parceria com Glória Gadelha, torna-se uma de suas obras mais conhecidas. Sivuca também compõe “João e Maria” com Chico Buarque e mantém outras colaborações.','Narrador','Sua música continua dialogando com a tradição e com novas sonoridades.']
]},
{c:'João Pessoa',n:'Legado',y:'2003–2006',col:['#26345c','#d58b59'],t:'Em 2003, Sivuca fixa residência em João Pessoa. Continua criando e revisitando sua obra; em 2006, lança “Sivuca Sinfônico”, com arranjos para a Orquestra Sinfônica do Recife. Morre em 14 de dezembro de 2006, em João Pessoa, deixando um legado que permanece vivo.',tip:'Faça uma última interpretação: toque a sequência final.',g:'Última interpretação: toque a melodia',ty:'seq',s:['k0','k2','k4','k5','k4','k2','k1','k0'],o:'A jornada termina, mas a música continua sendo tocada, estudada e compartilhada.',a:'Legado musical',
scenes:[
['A sanfona e a orquestra','Em 2006, “Sivuca Sinfônico” apresenta arranjos do próprio músico em diálogo com a Orquestra Sinfônica do Recife. A sanfona ocupa o centro de uma obra que aproxima linguagens populares e orquestrais.','Narrador','A trajetória de um instrumento popular encontra novas formas de expressão.'],
['De volta à Paraíba','Em 2003, Sivuca fixa residência em João Pessoa. Em 14 de dezembro de 2006, aos 76 anos, falece na capital paraibana.','Narrador','Sua história permanece ligada à Paraíba e à música brasileira.'],

let master,compressor,pressureGain,backTimer=null,muted=false,volume=.72;
function init(){
 if(ac){if(ac.state==='suspended')ac.resume();return}
 ac=new(window.AudioContext||window.webkitAudioContext)();
 pressureGain=ac.createGain();pressureGain.gain.value=0;

 compressor.threshold.value=-20;compressor.knee.value=18;compressor.ratio.value=3;
 compressor.attack.value=.008;compressor.release.value=.18;
 pressureGain.connect(master);master.connect(compressor);compressor.connect(ac.destination);
}
